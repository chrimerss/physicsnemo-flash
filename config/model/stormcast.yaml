# Network architecture
net:
  _target_: physicsnemo.models.diffusion.StormCastUNet
  img_in_channels: 21 # 9 background + 12 state input (6 precip + 6 streamflow)
  img_out_channels: 6 # 6 streamflow output
  model_channels: 64
  img_resolution: [1024, 1024]
  # Add other parameters as needed based on PhysicsNemo implementation

# Diffusion parameters (only used for diffusion training)
diffusion:
  sigma_min: 0.002
  sigma_max: 80.0
  rho: 7.0
  
# Regression weights path (for diffusion training)
regression_weights: null
